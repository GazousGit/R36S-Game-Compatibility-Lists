// ---- R36S handheld config: aiming + full gamepad binds ----
// This file is executed LAST, so these binds always win over stale config.cfg binds.

// --- Sensitivity / aim feel ---
sensitivity "3"
m_pitch "0.022"
m_yaw "0.022"
m_filter "1"
sv_aim "1"
crosshair "1"
cl_pitchspeed "225"
cl_yawspeed "210"
lookspring "0"
lookstrafe "0"
cl_bob "0.005"
cl_bobcycle "0.5"
gl_vsync "0"
fps_max "60"

// --- Gamepad binds (explicit; fixes leftover quick-save combo binds) ---
bind A_BUTTON "+use"
bind B_BUTTON "+jump"
bind X_BUTTON "impulse 100"
bind Y_BUTTON "+reload"
bind L1_BUTTON "+duck"
bind R1_BUTTON "+attack"
bind LTRIGGER "+speed"
bind RTRIGGER "+attack2"
bind DPAD_UP "impulse 201"
bind DPAD_DOWN "lastinv"
bind DPAD_LEFT "invprev"
bind DPAD_RIGHT "invnext"
bind START "pause"

// --- Select (BACK) opens the menu: save/load from there ---
bind BACK "cancelselect"
