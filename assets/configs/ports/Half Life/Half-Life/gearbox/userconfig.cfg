// ---- Half-Life / Opposing Force / Blue Shift (GoldSrc / Xash3D) ----
// Aiming-focused config for R36S handheld
// Place as userconfig.cfg in the mod folder (see notes)

// --- Sensitivity (main aiming lever; GoldSrc scale is small) ---
sensitivity "3"
m_pitch "0.022"
m_yaw "0.022"
m_filter "1"

// --- Legacy auto-aim attempt (may or may not be honored by the build) ---
sv_aim "1"

// --- Crosshair aid ---
crosshair "1"

// --- Turn feel / misc ---
cl_pitchspeed "225"
cl_yawspeed "210"
lookspring "0"
lookstrafe "0"
cl_bob "0.005"
cl_bobcycle "0.5"

// --- Small perf/clarity helpers ---
gl_vsync "0"
fps_max "60"