# This potato needs all the help it can get.

[Navigator]

# Pathfinding system uses navmesh to build paths. When disabled only pathgrid is used to build paths.
enable = false

[Video]

# Biggest performance lever: render 3D at half res, UI stays at 640x480.
# Drop to 0.4 if Balmora/Vivec still chug.
resolution scale = 0.5

[Input]

# Press sneak once to toggle instead of holding - much better on gamepad.
toggle sneak = true

[GUI]

subtitles = true
stretch menu background = true

[Saves]

# Autosave on rest/wait - protects against crashes.
autosave = true

[Game]

show effect duration = true
show projectile damage = true
show melee info = true
prevent merchant equipping = true
barter disposition change = true